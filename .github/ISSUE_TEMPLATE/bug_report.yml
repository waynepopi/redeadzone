name: Bug Report
description: Report a problem with Deadzone
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in as much detail as possible.
        **Do not include passwords, serial numbers, tokens, or personal information.**

  - type: input
    id: version
    attributes:
      label: Deadzone version
      description: Found in Add/Remove Programs or the title bar.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "e.g. Windows 11 23H2, Windows 10 22H2"
      placeholder: "Windows 11 23H2 (Build 22631)"
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Controller model
      description: "e.g. Xbox Series X controller, DualSense, 8BitDo Pro 2"
      placeholder: "Xbox Series X controller"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection method
      options:
        - USB
        - Bluetooth
        - USB adapter / dongle
        - Other
    validations:
      required: true

  - type: dropdown
    id: hidhide
    attributes:
      label: Is HidHide enabled?
      options:
        - "Yes"
        - "No"
        - "Not installed"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect controller via USB
        2. Click ENABLE
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste any relevant output here. Remove personal information.
      render: text
